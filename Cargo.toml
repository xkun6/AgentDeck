[package]
name = "agentdeck"
version = "0.3.5"
edition = "2021"
description = "AgentDeck (Tauri)"
authors = ["AgentDeck Contributors"]

[lib]
name = "agentdeck_core"

[dependencies]
# `devtools` keeps the WebView inspector available in release builds too, so the
# desktop ships in developer mode by default (toggled via a keyboard shortcut —
# see commands/devtools.rs). On macOS this uses a private API, which is fine for
# our dmg distribution since we don't publish through the App Store.
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
base64 = "0.22"
url = "2"
urlencoding = "2"
open = "5"
# Native filesystem watch powering the right-rail preview's "文件实时刷新"
# (commands/preview.rs). Raw change events are emitted to the renderer, which
# debounces before re-reading.
notify = "6"
futures-util = "0.3"
# WebSocket relay to the Node sidecar (commands/ws_proxy.rs).
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
fs2 = "0.4"
thiserror = "2"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
getrandom = "0.3"
tauri-plugin-clipboard-manager = "2.3.2"
# 诊断包 zip（commands/debug.rs），只启用 deflate
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# Read-only registry access for live PATH/PATHEXT resolution (path_resolver.rs).
winreg = "0.55"

[dev-dependencies]
pretty_assertions = "1"
serial_test = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
